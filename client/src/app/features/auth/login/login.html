<app-auth-shell>
  <header class="mb-8">
    <h2 class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome back</h2>
    <p class="mt-2 text-sm text-slate-500">Sign in to your WorkProvider360 account</p>
  </header>

  <app-alert type="success" [message]="notice()" />
  <app-alert type="error" [message]="error()" />

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-5 space-y-5" novalidate>
    <!-- Email -->
    <div>
      <label for="email" class="wp-label">Work Email</label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2.5 5.5A1.5 1.5 0 014 4h12a1.5 1.5 0 011.5 1.5v.2l-7.5 4.4L2.5 5.7v-.2z" />
            <path d="M17.5 7.5l-7.5 4.4L2.5 7.5V14A1.5 1.5 0 004 15.5h12A1.5 1.5 0 0017.5 14V7.5z" />
          </svg>
        </span>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@company.com"
          class="wp-input wp-input-icon"
        />
      </div>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="mt-1 text-xs font-medium text-red-600">Enter a valid email address.</p>
      }
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="wp-label">Password</label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 1a4 4 0 00-4 4v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V9a2 2 0 00-2-2h-1V5a4 4 0 00-4-4zm2 6V5a2 2 0 10-4 0v2h4z" clip-rule="evenodd" />
          </svg>
        </span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••••"
          class="wp-input wp-input-icon pr-11"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-600"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3.3 2.3a1 1 0 011.4 0l12 12a1 1 0 01-1.4 1.4l-1.7-1.6A9 9 0 0110 15c-4 0-7.3-2.3-8.9-5.6a1 1 0 010-.8A11 11 0 014 4.4L3.3 3.7a1 1 0 010-1.4zM10 12a2 2 0 01-2-2l2 2z"/></svg>
          } @else {
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 4C5.5 4 2.2 6.6 1 10c1.2 3.4 4.5 6 9 6s7.8-2.6 9-6c-1.2-3.4-4.5-6-9-6zm0 10a4 4 0 110-8 4 4 0 010 8zm0-2a2 2 0 100-4 2 2 0 000 4z"/></svg>
          }
        </button>
      </div>
    </div>

    <!-- Options -->
    <div class="flex items-center justify-between">
      <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" formControlName="remember" class="h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
        Remember me for 30 days
      </label>
      <a routerLink="/forgot-password" class="text-sm wp-link">Forgot password?</a>
    </div>

    <button type="submit" class="wp-btn-primary w-full" [disabled]="loading()">
      @if (loading()) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        Signing in…
      } @else {
        Sign in to WorkProvider360
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.3 4.3a1 1 0 011.4 0l5 5a1 1 0 010 1.4l-5 5a1 1 0 01-1.4-1.4L13.6 11H4a1 1 0 110-2h9.6l-3.3-3.3a1 1 0 010-1.4z" clip-rule="evenodd" /></svg>
      }
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-slate-500">
    Don't have an account?
    <a routerLink="/register" class="wp-link">Start free trial →</a>
  </p>

  <p class="mt-6 text-center text-xs text-slate-400">
    Protected by enterprise-grade encryption · SOC 2 Type II · PIPEDA compliant
  </p>
</app-auth-shell>
