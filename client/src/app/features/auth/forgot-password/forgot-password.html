<app-auth-shell>
  <header class="mb-8">
    <h2 class="text-3xl font-extrabold tracking-tight text-slate-900">Forgot password?</h2>
    <p class="mt-2 text-sm text-slate-500">
      Enter your email and we'll send you a link to reset your password.
    </p>
  </header>

  @if (done()) {
    <app-alert type="success" [message]="message()" />
    <a routerLink="/login" class="wp-btn-ghost mt-6 w-full">Back to sign in</a>
  } @else {
    <app-alert type="error" [message]="error()" />

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-5 space-y-5" novalidate>
      <div>
        <label for="email" class="wp-label">Work email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@company.com"
          class="wp-input"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-xs font-medium text-red-600">Enter a valid email address.</p>
        }
      </div>

      <button type="submit" class="wp-btn-primary w-full" [disabled]="loading()">
        @if (loading()) { Sending… } @else { Send reset link }
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-slate-500">
      Remembered it?
      <a routerLink="/login" class="wp-link">Sign in</a>
    </p>
  }
</app-auth-shell>
