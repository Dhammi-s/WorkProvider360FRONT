<section class="space-y-4">
  <div>
    <h1 class="text-2xl font-extrabold tracking-tight text-portal-900">Your services</h1>
    <p class="mt-1 text-sm text-slate-500">The care services set up for you.</p>
  </div>
  <app-alert type="error" [message]="error()" />
  @if (loading()) {
    <div class="wp-card flex items-center justify-center py-16 text-slate-400"><span class="text-sm">Loading…</span></div>
  } @else if (items().length === 0) {
    <div class="wp-card py-12 text-center"><p class="text-sm text-slate-500">No services listed yet.</p></div>
  } @else {
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      @for (s of items(); track s.serviceTypeId) {
        <div class="wp-card !p-4 flex items-start gap-3">
          <span class="mt-1 h-3 w-3 shrink-0 rounded-full" [style.background-color]="s.colorTag || '#14b8a6'"></span>
          <div>
            <div class="font-semibold text-slate-800">{{ s.name }}</div>
            @if (s.description) { <div class="text-sm text-slate-500">{{ s.description }}</div> }
          </div>
        </div>
      }
    </div>
  }
</section>
