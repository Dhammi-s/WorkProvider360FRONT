<div class="flex min-h-screen bg-portal-50">
  <!-- Mobile overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-slate-900/40 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-portal-panel py-6 text-white transition-transform lg:static lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex items-center gap-3 px-6">
      @if (branding.logo()) {
        <img [src]="branding.logo()" alt="logo" class="h-9 w-9 rounded-lg bg-white/10 object-contain p-1" />
      } @else {
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/15 text-sm font-bold">C</span>
      }
      <div>
        <div class="text-sm font-bold">{{ agency.name() || 'WorkProvider360' }}</div>
        <div class="text-xs text-white/70">Care portal</div>
      </div>
    </div>

    <nav class="wp-scroll mt-6 flex-1 space-y-1 overflow-y-auto px-3">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/15 text-white"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          (click)="sidebarOpen.set(false)"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-white/80 hover:bg-white/10 hover:text-white"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icon" /></svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="px-3">
      <button type="button" (click)="logout()" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-white/80 hover:bg-white/10 hover:text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 16l4-4m0 0l-4-4m4 4H7M13 16v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-portal-100 bg-white px-4 lg:px-8">
      <button type="button" (click)="sidebarOpen.set(!sidebarOpen())" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 lg:hidden" aria-label="Menu">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <div class="hidden text-sm font-semibold text-slate-500 lg:block">{{ agency.name() || 'Care portal' }}</div>
      <div class="relative ml-auto">
        <button type="button" (click)="menuOpen.set(!menuOpen())" class="flex h-9 w-9 items-center justify-center rounded-full bg-portal-100 text-sm font-bold text-portal-700">
          {{ initials() }}
        </button>
        @if (menuOpen()) {
          <div class="absolute right-0 z-20 mt-2 w-44 rounded-xl bg-white p-1 text-slate-700 shadow-2xl ring-1 ring-slate-100">
            <a routerLink="/portal/profile" (click)="menuOpen.set(false)" class="block rounded-lg px-3 py-2 text-sm hover:bg-slate-50">My profile</a>
            <button type="button" (click)="logout()" class="block w-full rounded-lg px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50">Sign out</button>
          </div>
        }
      </div>
    </header>

    <main class="flex-1 px-4 py-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>
