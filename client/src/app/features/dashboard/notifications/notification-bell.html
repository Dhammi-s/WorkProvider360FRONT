<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-900 transition hover:bg-slate-100"
    [attr.aria-label]="'Notifications' + (unread() ? ' (' + unread() + ' unread)' : '')"
  >
    <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0" /></svg>
    @if (unread() > 0) {
      <span class="absolute -right-0.5 -top-0.5 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white">{{ unread() > 99 ? '99+' : unread() }}</span>
    }
  </button>

  @if (open()) {
    <!-- click-away -->
    <div class="fixed inset-0 z-30" (click)="close()"></div>

    <div class="fixed inset-x-2 top-16 z-40 max-h-[75vh] overflow-hidden rounded-xl border border-slate-100 bg-white shadow-card sm:absolute sm:inset-x-auto sm:right-0 sm:top-full sm:mt-2 sm:max-h-none sm:w-80">
      <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
        <p class="text-sm font-bold text-slate-800">Notifications</p>
        @if (anyUnread()) {
          <button type="button" (click)="markAllRead()" [disabled]="markingAll()"
            class="text-xs font-semibold text-brand-600 hover:text-brand-800 disabled:opacity-50">Mark all read</button>
        }
      </div>

      <div class="wp-scroll max-h-[calc(75vh-3.25rem)] overflow-y-auto sm:max-h-96">
        @if (loading()) {
          <p class="py-8 text-center text-sm text-slate-400">Loading…</p>
        } @else if (items().length === 0) {
          <div class="flex flex-col items-center gap-2 py-10 text-slate-400">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0" /></svg>
            <p class="text-sm">You’re all caught up.</p>
          </div>
        } @else {
          <ul class="divide-y divide-slate-100">
            @for (n of items(); track n.notificationId) {
              <li>
                <button type="button" (click)="select(n)"
                  class="flex w-full gap-3 px-4 py-3 text-left transition hover:bg-slate-50 focus:outline-none focus-visible:bg-slate-50"
                  [class.bg-brand-50]="!n.isRead"
                  [attr.aria-expanded]="expanded() === n.notificationId"
                  [attr.aria-label]="(n.isRead ? '' : 'Unread: ') + (n.title || n.message)">
                  <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
                    [class]="isCustomPush(n) ? 'bg-indigo-100 text-indigo-700' : 'bg-brand-100 text-brand-700'">
                    @if (isCustomPush(n)) {
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>
                    } @else {
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" /></svg>
                    }
                  </span>
                  <span class="block min-w-0 flex-1">
                    @if (isCustomPush(n) && n.createdByName) {
                      <span class="block text-[11px] font-semibold uppercase tracking-wide text-indigo-600">From {{ n.createdByName }}</span>
                    }
                    @if (n.title) { <span class="block text-sm font-semibold text-slate-800">{{ n.title }}</span> }
                    <span class="block whitespace-pre-wrap break-words text-sm text-slate-600"
                      [class.line-clamp-3]="expanded() !== n.notificationId">{{ n.message }}</span>
                    <span class="mt-1 block text-[11px] text-slate-400">
                      @if (n.createdByName && !isCustomPush(n)) { {{ n.createdByName }} · }{{ n.createdOn | date: 'MMM d, h:mm a' }}
                    </span>
                  </span>
                  @if (!n.isRead) {
                    <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-brand-500" aria-hidden="true"></span>
                  }
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  }
</div>
