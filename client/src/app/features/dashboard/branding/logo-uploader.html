<div class="rounded-2xl border border-slate-100 bg-white p-6 shadow-card">
  <h2 class="text-base font-bold text-slate-900">Agency logo</h2>
  <p class="mt-1 text-sm text-slate-500">Upload and crop your logo. It appears in the sidebar. Stored in your database.</p>

  <app-alert type="success" [message]="notice()" />
  <app-alert type="error" [message]="error()" />

  <div class="mt-5 flex flex-col gap-6 sm:flex-row sm:items-start">
    <!-- Current logo preview -->
    <div class="flex flex-col items-center gap-2">
      <div class="flex h-24 w-24 items-center justify-center overflow-hidden rounded-2xl bg-brand-panel">
        @if (currentLogo()) {
          <img [src]="currentLogo()" alt="Agency logo" class="h-full w-full object-contain" />
        } @else {
          <svg class="h-10 w-10 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" /></svg>
        }
      </div>
      <span class="text-xs text-slate-400">Current</span>
    </div>

    <!-- Picker / cropper -->
    <div class="min-w-0 flex-1">
      <label class="wp-btn-ghost cursor-pointer">
        <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12m0-12l-4 4m4-4l4 4"/></svg>
        Choose image…
        <input type="file" accept="image/png,image/jpeg,image/webp" class="hidden" (change)="onFileSelected($event)" />
      </label>

      @if (fileEvent()) {
        <div class="mt-4 max-w-sm overflow-hidden rounded-xl border border-slate-200">
          <image-cropper
            [imageChangedEvent]="fileEvent()"
            [maintainAspectRatio]="true"
            [aspectRatio]="1"
            [roundCropper]="false"
            [resizeToWidth]="256"
            format="png"
            [output]="'base64'"
            (imageCropped)="onCropped($event)"
            (loadImageFailed)="onLoadFailed()"
          />
        </div>

        <div class="mt-4 flex items-center gap-3">
          <button type="button" (click)="save()" [disabled]="saving() || !cropped()" class="wp-btn-primary">
            @if (saving()) { Saving… } @else { Save logo }
          </button>
          <button type="button" (click)="cancel()" class="wp-btn-ghost">Cancel</button>
        </div>
      }
    </div>
  </div>
</div>
