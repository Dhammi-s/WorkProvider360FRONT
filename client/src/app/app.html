<router-outlet />

<!-- Full-screen offline page: shown whenever the browser reports no connection -->
@if (!online()) {
  <div class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-50 px-6">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-2xl ring-1 ring-slate-100">
      <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-50 text-red-500">
        <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" />
        </svg>
      </span>
      <h1 class="mt-5 text-xl font-extrabold tracking-tight text-slate-900">No internet connection</h1>
      <p class="mt-2 text-sm text-slate-500">
        You appear to be offline. Check your network connection and try again — the page will reconnect automatically once you're back online.
      </p>
      <button type="button" (click)="retry()" class="wp-btn-primary mx-auto mt-6">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" /></svg>
        Try again
      </button>
    </div>
  </div>
}
